[package]
name = "metriccraft-engine"
description = "Document, commands, undo/redo and cross-filter state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
metriccraft-core = { path = "../core" }
metriccraft-data = { path = "../data" }
metriccraft-model = { path = "../model" }
metriccraft-file = { path = "../file" }
metriccraft-visuals = { path = "../visuals", default-features = false }
arrow-schema.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Snapshot PNGs for eyeballing (`cargo xtask snapshot`).
metriccraft-visuals = { path = "../visuals" }
arrow-array.workspace = true
arrow-cast.workspace = true

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "import"
harness = false

[[bench]]
name = "dax"
harness = false

[[bench]]
name = "page"
harness = false
