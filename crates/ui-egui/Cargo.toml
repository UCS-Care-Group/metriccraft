[package]
name = "metriccraft-ui-egui"
description = "Desktop and web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
metriccraft-engine = { path = "../engine", default-features = false }
metriccraft-core = { path = "../core" }
metriccraft-model = { path = "../model" }
metriccraft-dax = { path = "../dax" }
arrow-array = { workspace = true }
metriccraft-visuals = { path = "../visuals", default-features = false }
egui = { workspace = true }
egui_dock = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Headless rendering (wgpu) for UI snapshots and `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
