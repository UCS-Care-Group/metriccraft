[package]
name = "metriccraft-visuals"
description = "Visual definitions, visual queries and layout to draw primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["png"]
# The PNG renderer: CLI page renders, snapshots, the page bench.
png = ["dep:tiny-skia"]

[dependencies]
ab_glyph = "0.2"
metriccraft-core = { path = "../core" }
metriccraft-data = { path = "../data" }
metriccraft-dax = { path = "../dax" }
metriccraft-model = { path = "../model" }
serde_json.workspace = true
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "png-format"] }

[dev-dependencies]
arrow-array.workspace = true
