[package]
name = "opendash-visuals"
description = "Visual definitions, visual queries and layout to draw primitives."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["png"]
# The PNG renderer (ADR 0007): CLI page renders, snapshots, the N-3 bench.
png = ["dep:tiny-skia"]

[dependencies]
ab_glyph = "0.2"
opendash-core = { path = "../core" }
opendash-data = { path = "../data" }
opendash-dax = { path = "../dax" }
opendash-model = { path = "../model" }
tiny-skia = { version = "0.12", optional = true, default-features = false, features = ["std", "png-format"] }

[dev-dependencies]
arrow-array.workspace = true
