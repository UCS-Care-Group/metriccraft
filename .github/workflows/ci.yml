name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Hosted runners only: the repo is public, so never a self-hosted one (public PRs run here).
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      # Hosted Ubuntu has ~14 GB free; debug tests plus release benches need more.
      - if: matrix.os == 'linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the channel, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Apple's clang has no wasm32 target; zstd-sys (Parquet) needs one for the wasm build.
      - if: matrix.os == 'macos'
        run: |
          brew install llvm
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo xtask ci
      # The release build below needs the disk the debug build used (hosted runners have ~14 GB).
      - run: cargo clean --profile dev
      # Cold start and idle memory of the desktop app (N-8): skipped without a display or xvfb-run.
      - run: cargo xtask ui-bench
