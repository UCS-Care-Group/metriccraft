name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Hosted runners only: the repo is public, so never a self-hosted one (public PRs run here).
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      # Hosted Ubuntu has ~14 GB free; debug tests plus release benches need more.
      # ui-bench needs a virtual display with software OpenGL (Mesa llvmpipe).
      - if: matrix.os == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the channel, components and targets pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Apple's clang has no wasm32 target; zstd-sys (Parquet) needs one for the wasm build.
      - if: matrix.os == 'macos'
        run: |
          brew install llvm
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/llvm-ar" >> "$GITHUB_ENV"
      # deny has its own job below.
      - run: cargo xtask ci
        env:
          XTASK_CI_SKIP: deny
      # The release build below needs the disk the debug build used (hosted runners have ~14 GB).
      - run: cargo clean --profile dev
      # Cold start and idle memory of the desktop app: skipped without a display or xvfb-run.
      - run: cargo xtask ui-bench

  # cargo-deny (deny.toml): RustSec advisories, licences, duplicate crates, sources. Its own job,
  # since it needs no build; `ci` skips the step it would otherwise run.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask deny
