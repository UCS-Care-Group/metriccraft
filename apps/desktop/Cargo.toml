[package]
name = "metriccraft"
description = "MetricCraft desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# glow (OpenGL) by default: smaller and lighter at idle; wgpu if glow misbehaves.
default = ["glow"]
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
metriccraft-engine = { path = "../../crates/engine" }
metriccraft-ui-egui = { path = "../../crates/ui-egui" }
eframe = { workspace = true, features = ["accesskit", "default_fonts", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
# Waits for an rfd dialog off the UI thread; rfd already builds it on Linux.
pollster = "0.4"
