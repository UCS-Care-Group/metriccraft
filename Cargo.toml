[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/benandez/opendash-bi"
publish = false

[workspace.dependencies]
serde_json = "1"
bytes = "1"
arrow-array = "60"
arrow-buffer = "60"
arrow-cast = { version = "60", default-features = false }
arrow-schema = "60"
arrow-select = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "flate2-rust_backend", "lz4", "brotli", "zstd"] }
csv = "1.4"
encoding_rs = "0.8"
calamine = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
